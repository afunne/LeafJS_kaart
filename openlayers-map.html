<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLayers kaart | Kaardiprojekt</title>
  <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/pure-min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .popup {
      position: relative;
      min-width: 190px;
      padding: 12px 34px 12px 14px;
      border: 1px solid #17211f;
      border-radius: 4px;
      background: #fffdf7;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
    }

    .popup-close {
      position: absolute;
      top: 5px;
      right: 7px;
      border: 0;
      background: transparent;
      color: #17211f;
      cursor: pointer;
      font-size: 18px;
    }

    .distance-control {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 1;
      padding: 8px 11px;
      border: 2px solid #fff;
      border-radius: 4px;
      background: #286451;
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      font: 600 13px/1.2 system-ui, sans-serif;
    }
  </style>
</head>
<body class="map-page">
  <header class="site-header">
    <a class="brand" href="index.html">Kaardiprojekt</a>
    <nav class="site-nav pure-menu pure-menu-horizontal" aria-label="Põhinavigatsioon">
      <ul class="pure-menu-list">
        <li class="pure-menu-item"><a class="pure-menu-link" href="index.html">Avaleht</a></li>
        <li class="pure-menu-item"><a class="pure-menu-link" href="kaart.html">LeafletJS kaart</a></li>
        <li class="pure-menu-item pure-menu-selected"><a class="pure-menu-link" href="openlayers-map.html" aria-current="page">OpenLayers kaart</a></li>
        <li class="pure-menu-item"><a class="pure-menu-link" href="mapbox-map.html">Mapbox kaart</a></li>
        <li class="pure-menu-item"><a class="pure-menu-link" href="comparison.html">Töö kirjeldus</a></li>
      </ul>
    </nav>
  </header>
  <div id="map" aria-label="OpenLayers kaart KML marsruudiga"></div>
  <div id="distance-control" class="distance-control">Teekonna pikkus: arvutan...</div>
  <div id="popup" class="popup" hidden>
    <button id="popup-close" class="popup-close" type="button" aria-label="Sulge">&times;</button>
    <div id="popup-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <script src="openlayers-map.js"></script>
</body>
</html>
